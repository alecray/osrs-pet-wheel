name: Check pet data against the OSRS Wiki

on:
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "data/pets.json"
      - "check_pets.py"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run check_pets.py
        id: check
        run: |
          set +e
          python check_pets.py | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Open or update a drift issue
        if: steps.check.outputs.status != '0' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '`check_pets.py` found pet data drift against the OSRS Wiki:\n\n```\n' + fs.readFileSync('report.txt', 'utf8') + '\n```\n\nAdd a row to `data/pets.json` (and `pet_ranker.py` / `build_pet_data.py` if it is a huntable pet), or add the page to `IGNORED_PAGES` in `check_pets.py`, then run `python build_pet_data.py`.';
            const title = 'Pet data drift detected by check_pets.py';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pet-data' });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['pet-data'] });
            }
      - name: Fail on drift
        if: steps.check.outputs.status != '0'
        run: exit 1
